allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  zod: ^4.4.3
  # Patchs sécurité (pnpm audit) sur des dépendances transitives — bornes
  # patch/minor uniquement, jamais de montée de version majeure ici.
  #
  # brace-expansion délibérément PAS overridé ici malgré l'advisory (DoS via
  # expansion non bornée, corrigé en >=5.0.8) : cette version casse
  # minimatch@3.1.5 (dépendance interne d'ESLint via @eslint/config-array),
  # qui appelle une API que brace-expansion 5.x a supprimée — `pnpm lint`
  # devient inutilisable. Risque réel jugé négligeable (DoS côté outillage
  # de lint/build en dev, jamais atteignable par un utilisateur de l'app
  # déployée) — non patché plutôt que de casser la chaîne d'outils.
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
  "@hono/node-server": ">=2.0.5"
